<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C4DFF"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8888a0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="540" rx="18" fill="#ffffff"/>

  <text x="490" y="40" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="bold" fill="#1a1a28" text-anchor="middle">두 가지 재생 엔진 — 상황에 따라 선택</text>

  <!-- ================= AI OFF 레인 ================= -->
  <rect x="25" y="62" width="450" height="330" rx="14" fill="#F6F3FF" stroke="#DDD2FF" stroke-width="1.5"/>
  <rect x="45" y="80" width="170" height="30" rx="15" fill="#7C4DFF"/>
  <text x="130" y="100" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AI OFF · WAV 캐시 · 절전</text>

  <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="12">
    <rect x="42" y="140" width="92" height="58" rx="10" fill="#ffffff" stroke="#C9B8FF" stroke-width="1.5"/>
    <text x="88" y="164" text-anchor="middle" fill="#33334a">원본</text>
    <text x="88" y="180" text-anchor="middle" fill="#33334a">오디오 파일</text>

    <line x1="134" y1="169" x2="158" y2="169" stroke="#7C4DFF" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="162" y="140" width="92" height="58" rx="10" fill="#ffffff" stroke="#C9B8FF" stroke-width="1.5"/>
    <text x="208" y="164" text-anchor="middle" fill="#33334a">MixCache</text>
    <text x="208" y="180" text-anchor="middle" fill="#33334a" font-size="11">WAV (44.1k)</text>

    <line x1="254" y1="169" x2="278" y2="169" stroke="#7C4DFF" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="282" y="132" width="120" height="74" rx="10" fill="#7C4DFF"/>
    <text x="342" y="160" text-anchor="middle" fill="#ffffff" font-weight="bold">실시간 DSP</text>
    <text x="342" y="176" text-anchor="middle" fill="#E9DDFF" font-size="11">(DspChain)</text>

    <line x1="402" y1="169" x2="426" y2="169" stroke="#7C4DFF" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="430" y="140" width="38" height="58" rx="10" fill="#ffffff" stroke="#C9B8FF" stroke-width="1.5"/>
    <text x="449" y="166" text-anchor="middle" fill="#33334a" font-size="11">반주</text>
    <text x="449" y="180" text-anchor="middle" fill="#33334a" font-size="11">출력</text>

    <!-- DSP 세부 태그 -->
    <g font-size="11">
      <rect x="52" y="240" width="188" height="26" rx="13" fill="#ffffff" stroke="#DDD2FF"/>
      <text x="146" y="257" text-anchor="middle" fill="#5B3FBF">보컬 = 중앙 마스킹 (저역 보존)</text>
      <rect x="252" y="240" width="196" height="26" rx="13" fill="#ffffff" stroke="#DDD2FF"/>
      <text x="350" y="257" text-anchor="middle" fill="#5B3FBF">베이스 = f0 배음 노칭 + HPF</text>
      <rect x="52" y="274" width="188" height="26" rx="13" fill="#ffffff" stroke="#DDD2FF"/>
      <text x="146" y="291" text-anchor="middle" fill="#5B3FBF">드럼 = STFT 타악 억제(HPSS)</text>
      <rect x="252" y="274" width="196" height="26" rx="13" fill="#ffffff" stroke="#DDD2FF"/>
      <text x="350" y="291" text-anchor="middle" fill="#5B3FBF">기타 = 중역대 페킹 딥 (근사)</text>
    </g>
    <text x="250" y="330" text-anchor="middle" font-size="12" fill="#66667e">캐시 후 즉시 시작 · 배터리 거의 없음 · 완전 분리는 아님</text>
    <text x="250" y="352" text-anchor="middle" font-size="12" fill="#66667e">체크 해제/변경 즉시 반영</text>
  </g>

  <!-- ================= AI ON 레인 ================= -->
  <rect x="505" y="62" width="450" height="330" rx="14" fill="#FFF7EF" stroke="#FFDDBB" stroke-width="1.5"/>
  <rect x="525" y="80" width="190" height="30" rx="15" fill="#E8730C"/>
  <text x="620" y="100" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AI ON · 온디바이스 분리 · 고품질</text>

  <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="12">
    <rect x="520" y="136" width="86" height="56" rx="10" fill="#ffffff" stroke="#FFCF9E" stroke-width="1.5"/>
    <text x="563" y="159" text-anchor="middle" fill="#33334a">원본</text>
    <text x="563" y="175" text-anchor="middle" fill="#33334a">오디오 파일</text>

    <line x1="606" y1="164" x2="628" y2="164" stroke="#E8730C" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="632" y="136" width="96" height="56" rx="10" fill="#ffffff" stroke="#FFCF9E" stroke-width="1.5"/>
    <text x="680" y="159" text-anchor="middle" fill="#33334a">MediaCodec</text>
    <text x="680" y="175" text-anchor="middle" fill="#33334a" font-size="11">44.1kHz 디코딩</text>

    <line x1="728" y1="164" x2="750" y2="164" stroke="#E8730C" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="754" y="128" width="186" height="72" rx="10" fill="#E8730C"/>
    <text x="847" y="156" text-anchor="middle" fill="#ffffff" font-weight="bold">Demucs ONNX</text>
    <text x="847" y="174" text-anchor="middle" fill="#FFE7CC" font-size="11">htdemucs · 곡당 1회</text>

    <!-- 스템 캐시 -->
    <line x1="847" y1="200" x2="847" y2="226" stroke="#E8730C" stroke-width="2" marker-end="url(#arg)"/>

    <rect x="520" y="230" width="420" height="64" rx="10" fill="#ffffff" stroke="#FFCF9E" stroke-width="1.5"/>
    <text x="536" y="256" fill="#33334a" font-size="12">스템 WAV 캐시</text>
    <g font-size="10">
      <rect x="650" y="242" width="64" height="20" rx="10" fill="#F3E8FF"/><text x="682" y="255" text-anchor="middle" fill="#5B3FBF">drums</text>
      <rect x="720" y="242" width="64" height="20" rx="10" fill="#F3E8FF"/><text x="752" y="255" text-anchor="middle" fill="#5B3FBF">bass</text>
      <rect x="790" y="242" width="64" height="20" rx="10" fill="#F3E8FF"/><text x="822" y="255" text-anchor="middle" fill="#5B3FBF">other</text>
      <rect x="860" y="242" width="64" height="20" rx="10" fill="#F3E8FF"/><text x="892" y="255" text-anchor="middle" fill="#5B3FBF">vocals</text>
    </g>
    <text x="536" y="280" font-size="11" fill="#8888a0">한 번만 분리 — 이후엔 바로 재사용</text>

    <line x1="730" y1="294" x2="730" y2="316" stroke="#E8730C" stroke-width="2" marker-end="url(#arg)"/>

    <rect x="590" y="320" width="220" height="48" rx="10" fill="#ffffff" stroke="#FFCF9E" stroke-width="1.5"/>
    <text x="700" y="340" text-anchor="middle" fill="#33334a">StemMixPlayer</text>
    <text x="700" y="357" text-anchor="middle" fill="#66667e" font-size="11">체크된 스텝 게인 0 · 피치 ±12</text>

    <line x1="810" y1="344" x2="838" y2="344" stroke="#E8730C" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="842" y="320" width="98" height="48" rx="10" fill="#ffffff" stroke="#FFCF9E" stroke-width="1.5"/>
    <text x="891" y="340" text-anchor="middle" fill="#33334a">정확히 제거된</text>
    <text x="891" y="357" text-anchor="middle" fill="#33334a">반주 출력</text>
  </g>

  <!-- 하단 공통 배지 -->
  <rect x="25" y="418" width="930" height="46" rx="12" fill="#101018"/>
  <text x="490" y="447" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#EDEAFF" text-anchor="middle">공통: 다른 앱 오디오 요청 시 자동 일시정지 · 이어폰 분리 시 정지 · 백그라운드 알림 제어 · 키 조절 ±12반음</text>
</svg>
