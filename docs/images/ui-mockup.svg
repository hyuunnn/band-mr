      <rect x="24" y="300" width="242" height="30" rx="8" fill="#181822"/>
      <rect x="32" y="306" width="17" height="17" rx="4" fill="#7C4DFF"/>
      <path d="M36 314 l4 4 l7 -8" stroke="#ffffff" stroke-width="2.4" fill="none"/>
