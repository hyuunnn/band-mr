    <text x="145" y="62" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Wonderwall</text>

    <!-- 진행바 -->
    <rect x="24" y="84" width="242" height="5" rx="2.5" fill="#26262f"/>
    <rect x="24" y="84" width="92" height="5" rx="2.5" fill="#CFBCFF"/>
    <circle cx="116" cy="86.5" r="6" fill="#CFBCFF"/>
