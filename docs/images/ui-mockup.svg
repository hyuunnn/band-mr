      <text x="50" y="119" font-size="10" fill="#8888a0">약 178MB · 속도·품질 균형</text>
      <text x="266" y="112" font-size="11" fill="#64FFDA" text-anchor="end">✓ 다운로드됨</text>

      <rect x="14" y="168" width="262" height="72" rx="12" fill="#181822"/>
      <circle cx="34" cy="188" r="8" fill="none" stroke="#55556a" stroke-width="2"/>
      <text x="50" y="184" font-size="12" fill="#ffffff">경량 우선</text>
      <text x="50" y="199" font-size="10" fill="#8888a0">약 178MB · 빠르고 저발열</text>
      <rect x="196" y="180" width="70" height="26" rx="13" fill="#7C4DFF"/>
      <text x="231" y="197" font-size="11" fill="#ffffff" text-anchor="middle">받기</text>

      <rect x="14" y="248" width="262" height="72" rx="12" fill="#181822"/>
      <circle cx="34" cy="268" r="8" fill="none" stroke="#55556a" stroke-width="2"/>
      <text x="50" y="264" font-size="12" fill="#ffffff">품질 우선</text>
      <text x="50" y="279" font-size="10" fill="#8888a0">약 178MB · RAM 4GB 이상 권장</text>
      <rect x="24" y="304" width="160" height="5" rx="2.5" fill="#26262f"/>
      <rect x="24" y="304" width="102" height="5" rx="2.5" fill="#CFBCFF"/>
      <text x="192" y="310" font-size="10" fill="#8888a0">64%</text>
