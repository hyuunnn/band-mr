      <text x="258" y="217" font-size="10" fill="#8888a0" text-anchor="end">제거됨</text>

      <rect x="24" y="232" width="242" height="30" rx="8" fill="#181822"/>
      <rect x="32" y="238" width="17" height="17" rx="4" fill="#7C4DFF"/>
      <path d="M36 246 l4 4 l7 -8" stroke="#ffffff" stroke-width="2.4" fill="none"/>
      <text x="58" y="251" fill="#ffffff">드럼</text>

      <rect x="24" y="266" width="242" height="30" rx="8" fill="#181822"/>
      <rect x="32" y="272" width="17" height="17" rx="4" fill="none" stroke="#55556a" stroke-width="2"/>
