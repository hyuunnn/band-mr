<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450">
  <rect x="0" y="0" width="980" height="450" rx="18" fill="#ffffff"/>

  <!-- ======== 폰 1: 라이브러리 ======== -->
  <g transform="translate(25,15)">
    <rect x="0" y="0" width="290" height="370" rx="26" fill="#0e0e16" stroke="#33333f" stroke-width="2"/>
    <text x="20" y="38" font-family="-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="bold" fill="#ffffff">밴드 MR</text>
    <g transform="translate(258,26)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#bbbbcc" stroke-width="2"/>
      <line x1="0" y1="-11" x2="0" y2="-7" stroke="#bbbbcc" stroke-width="2"/>
      <line x1="0" y1="11" x2="0" y2="7" stroke="#bbbbcc" stroke-width="2"/>
      <line x1="-11" y1="0" x2="-7" y2="0" stroke="#bbbbcc" stroke-width="2"/>
      <line x1="11" y1="0" x2="7" y2="0" stroke="#bbbbcc" stroke-width="2"/>
    </g>

    <!-- 곡 카드 -->
    <g font-family="-apple-system,'Segoe UI',sans-serif">
      <rect x="14" y="58" width="262" height="56" rx="12" fill="#181822"/>
      <circle cx="42" cy="86" r="12" fill="#7C4DFF" opacity="0.85"/>
      <text x="66" y="82" font-size="13" fill="#ffffff">Wonderwall</text>
      <text x="66" y="100" font-size="11" fill="#8888a0">3:42 · AI 분리됨</text>

      <rect x="14" y="124" width="262" height="56" rx="12" fill="#181822"/>
      <circle cx="42" cy="152" r="12" fill="#7C4DFF" opacity="0.55"/>
      <text x="66" y="148" font-size="13" fill="#ffffff">Don't Look Back in Anger</text>
      <text x="66" y="166" font-size="11" fill="#8888a0">4:47</text>

      <rect x="14" y="190" width="262" height="56" rx="12" fill="#181822"/>
      <circle cx="42" cy="218" r="12" fill="#7C4DFF" opacity="0.55"/>
      <text x="66" y="214" font-size="13" fill="#ffffff">Champagne Supernova</text>
      <text x="66" y="232" font-size="11" fill="#8888a0">7:27 · AI 분리됨</text>
    </g>

