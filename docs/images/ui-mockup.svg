  <!-- ======== 폰 2: 플레이어 ======== -->
  <g transform="translate(348,15)">
    <rect x="0" y="0" width="290" height="370" rx="26" fill="#0e0e16" stroke="#33333f" stroke-width="2"/>
    <polyline points="26,32 18,24 26,16" fill="none" stroke="#bbbbcc" stroke-width="2"/>
